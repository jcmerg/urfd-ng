# a WebSocket upgrade only when the client asks for one (the tcd monitor below)
map $http_upgrade $tcd_connection {
    default upgrade;
    ''      '';
}

# HTTPS as the TLS proxy in front says, else this server's own scheme
map $http_x_forwarded_proto $tcd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# the XLX directory's reflector list, kept a while so the list pages work
# without asking it every time and while it is down (in the container, a new
# image starts without it)
proxy_cache_path /var/cache/nginx/urfd-xlxdir levels=1 keys_zone=xlxdir:1m max_size=20m inactive=30d use_temp_path=off;

server {
    listen 8363;
    server_name _;

    root /var/www/urfd-dashboard;
    index index.html;

    access_log /var/log/nginx/urfd-dashboard-access.log;
    error_log /var/log/nginx/urfd-dashboard-error.log;

    # the names of the outside servers below are looked up while nginx runs, so
    # nginx starts without DNS; the container puts the system's resolver into
    # the line marked RESOLVER at start
    resolver 127.0.0.53 valid=300s;   # RESOLVER
    resolver_timeout 5s;

    # the dashboard is static: it reads everything from /ws. Asked again on
    # every load, so an update shows without a forced reload
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /fonts/ {
        expires 30d;
    }

    # the pages of the PHP dashboard before 3.0, for old bookmarks
    location = /index.php {
        absolute_redirect off;
        return 301 /$is_args$args;
    }

    location /json/ {
        return 410;
    }

    # the live dashboard of 4.13 to 4.37 is this one now
    location /live {
        absolute_redirect off;
        return 301 /;
    }

    # live events from urfd's [WebSocket] (loopback only, port 10102), and the
    # admin page's commands; 502 while it is disabled. A TLS proxy in front
    # needs the same Upgrade headers.
    location /ws {
        proxy_pass http://127.0.0.1:10102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # the reflector list of the XLX directory, for the Reflector list and Peers
    # pages; fresh for 5 minutes, an old copy while the directory is down
    location = /xlxapi/reflectorlist {
        set $xlxapi xlxapi.rlx.lu;
        proxy_pass http://$xlxapi/api.php?do=GetReflectorList;
        proxy_set_header Host xlxapi.rlx.lu;
        proxy_set_header Cookie "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_cache xlxdir;
        proxy_cache_key xlxapi-reflectorlist;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-cache";
    }

    # the last 10 KB of the QuadNet routing feed, for the QuadNet live page
    location = /quadnet/ics {
        set $quadnet irc-1.openquad.net;
        proxy_pass https://$quadnet/ics/ics;
        proxy_set_header Host irc-1.openquad.net;
        proxy_set_header Range "bytes=-10240";
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name irc-1.openquad.net;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store";
    }

    # the monitor of a tcd next to urfd (the Docker tcd service), from outside
    # through the TLS proxy; 502 without one. Set MonitorPassword in its tcd.ini.
    # The port is its MonitorHttpPort: the container puts $TCD_MONITOR_PORT
    # (default 8080, docker/build.sh takes it from the tcd.ini) into the line
    # marked TCD_MONITOR_PORT at start. A TLS proxy in front passes /tcd/ with the
    # Upgrade headers, X-Real-IP and X-Forwarded-Proto.
    location = /tcd {
        absolute_redirect off;
        return 301 /tcd/;
    }

    location /tcd/ {
        # the client's address for tcd's login pause: from the proxy in front, else the peer
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Real-IP;
        proxy_pass http://127.0.0.1:8080/;   # TCD_MONITOR_PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tcd_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tcd_proto;
        proxy_read_timeout 120s;
    }

    location ~ /\. {
        deny all;
    }
}
