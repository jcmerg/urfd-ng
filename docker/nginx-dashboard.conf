# a WebSocket upgrade only when the client asks for one (the tcd monitor below)
map $http_upgrade $tcd_connection {
    default upgrade;
    ''      '';
}

# HTTPS as the TLS proxy in front says, else this server's own scheme
map $http_x_forwarded_proto $tcd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 8363;
    server_name _;

    root /var/www/urfd-dashboard;
    index index.php;

    access_log /var/log/nginx/urfd-dashboard-access.log;
    error_log /var/log/nginx/urfd-dashboard-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # The JSON API routes clean paths (/json/metadata, /json/status, ...) inside
    # json/index.php by matching REQUEST_URI. Upstream ships that rewrite as a
    # json/.htaccess, which nginx ignores, so without this block the generic
    # try_files above falls back to the dashboard's own index.php and every
    # endpoint answers 200 with an HTML page instead of JSON.
    # REQUEST_URI survives the internal redirect, so the PHP switch still matches.
    location /json/ {
        try_files $uri $uri/ /json/index.php;
    }

    # live events from urfd's [WebSocket] (loopback only, port 10102); 502
    # while it is disabled. A TLS proxy in front needs the same Upgrade headers.
    location /ws {
        proxy_pass http://127.0.0.1:10102;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # the live dashboard (dashboard-ws, static) next to this one
    # relative: behind the TLS proxy the absolute one would name port 8363
    location = /live {
        absolute_redirect off;
        return 301 /live/;
    }

    location /live/ {
        alias /var/www/urfd-dashboard-ws/;
        index index.html;
    }

    # the monitor of a tcd next to urfd (the Docker tcd service), from outside
    # through the TLS proxy; 502 without one. Set MonitorPassword in its tcd.ini.
    # The port is its MonitorHttpPort: the container puts $TCD_MONITOR_PORT
    # (default 8080, docker/build.sh takes it from the tcd.ini) into the line
    # marked TCD_MONITOR_PORT at start. A TLS proxy in front passes /tcd/ with the
    # Upgrade headers, X-Real-IP and X-Forwarded-Proto.
    location = /tcd {
        absolute_redirect off;
        return 301 /tcd/;
    }

    location /tcd/ {
        # the client's address for tcd's login pause: from the proxy in front, else the peer
        set_real_ip_from 127.0.0.1;
        set_real_ip_from ::1;
        real_ip_header X-Real-IP;
        proxy_pass http://127.0.0.1:8080/;   # TCD_MONITOR_PORT
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tcd_connection;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $tcd_proto;
        proxy_read_timeout 120s;
    }

    location ~ \.php$ {
        # The dashboard takes no forms or uploads. A multipart body is how
        # php2shell (CVE-2026-109618/-109619) drives PHP out of memory, so
        # keep it away from php-fpm entirely.
        if ($content_type ~* "multipart/") {
            return 415;
        }
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
    }

    location ~ /\. {
        deny all;
    }
}
