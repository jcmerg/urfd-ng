[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:urfd]
command=/usr/local/bin/urfd /usr/local/etc/urfd/urfd.ini
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:php-fpm]
command=/usr/sbin/php-fpm8.3 -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:nginx]
; the tcd monitor's port for /tcd/ (TCD_MONITOR_PORT, see nginx-dashboard.conf), then nginx
command=/bin/sh -c 'p="${TCD_MONITOR_PORT:-8080}"; case "$p" in ""|*[!0-9]*) p=8080;; esac; sed -i "/# TCD_MONITOR_PORT/s#127\.0\.0\.1:[0-9]*/#127.0.0.1:$p/#" /etc/nginx/sites-available/urfd-dashboard.conf && exec /usr/sbin/nginx -g "daemon off;"'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
