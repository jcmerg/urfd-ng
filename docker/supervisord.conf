[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:urfd]
command=/usr/local/bin/urfd /usr/local/etc/urfd/urfd.ini
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:nginx]
; the tcd monitor's port for /tcd/ (TCD_MONITOR_PORT) and the system's resolver for
; the reflector list and QuadNet (RESOLVER), see nginx-dashboard.conf, then nginx
; (no space before a hash in the command: supervisord takes that for a comment)
command=/bin/sh -c 'p="${TCD_MONITOR_PORT:-8080}"; case "$p" in ""|*[!0-9]*) p=8080;; esac; r=$(awk "/^nameserver/ { print \$2; exit }" /etc/resolv.conf); case "$r" in *:*) r="[$r]";; "") r=127.0.0.53;; esac; sed -i -e "/# TCD_MONITOR_PORT/s#127\.0\.0\.1:[0-9]*/#127.0.0.1:$p/#" -e "/# RESOLVER/s|resolver [^ ]* |resolver $r |" /etc/nginx/sites-available/urfd-dashboard.conf && exec /usr/sbin/nginx -g "daemon off;"'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=30
