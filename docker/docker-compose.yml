# urfd reflector with its dashboard, built from this repository.
#
# The image is built from the checkout this file lives in. Configuration and
# state live outside the checkout, in $URFD_DATA (default /opt/urfd), so a
# git pull never touches them:
#   $URFD_DATA/config/                     urfd.ini, interlink, black/whitelist, databases
#   $URFD_DATA/dashboard/config.inc.php    dashboard settings
#   $URFD_DATA/xlxd-ch/                    CallingHome state
#
# setup.sh in the repository root creates all of this. By hand:
#   cd docker && docker compose build && docker compose up -d
#
# tcd in Docker, software only with a codec plugin in tcd/plugins/<name>/ (see
# "tcd in Docker" in tcd/README.md), with its tcd.ini in $URFD_DATA/tcd/:
#   docker compose --profile tcd build && docker compose --profile tcd up -d
name: urfd

services:
  urfd:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      additional_contexts:
        optfiles: .
    image: urfd:latest
    container_name: urfd
    # built here, not pulled: watchtower and the like must leave it alone
    labels:
      - com.centurylinklabs.watchtower.enable=false
    network_mode: host
    restart: unless-stopped
    # realtime scheduling for steady voice timing
    cap_add:
      - SYS_NICE
      - SYS_RESOURCE
    ulimits:
      rtprio: 99
      nice: -20
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${URFD_DATA:-/opt/urfd}/config:/usr/local/etc/urfd
      - ${URFD_DATA:-/opt/urfd}/dashboard/config.inc.php:/var/www/urfd-dashboard/pgs/config.inc.php
      - ${URFD_DATA:-/opt/urfd}/xlxd-ch:/var/lib/xlxd-ch
      # XML status file shared between urfd and the dashboard
      - urfd-xml:/var/log
    environment:
      # the Docker tcd's MonitorHttpPort, for the dashboard's /tcd/ (build.sh takes it from its tcd.ini)
      - TCD_MONITOR_PORT=${TCD_MONITOR_PORT:-8080}
    # keep the log from filling the disk on a reflector that runs for months
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pgrep", "urfd"]
      interval: 30s
      timeout: 5s
      retries: 3

  # the transcoder, only with --profile tcd; see "tcd in Docker" in tcd/README.md
  tcd:
    profiles: [tcd]
    build:
      context: ..
      dockerfile: docker/Dockerfile.tcd
    image: urfd-tcd:latest
    container_name: tcd
    # built here, not pulled: watchtower and the like must leave it alone
    labels:
      - com.centurylinklabs.watchtower.enable=false
    network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    volumes:
      # tcd.ini, writable: the monitor's Save writes to it
      - ${URFD_DATA:-/opt/urfd}/tcd:/usr/local/etc/tcd
    # with AMBE sticks docker-compose.tcd-sticks.yml adds the devices (build.sh does that by itself)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "pgrep", "tcd"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  urfd-xml:
