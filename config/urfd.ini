##############################################################################
#  URFD Configuration
#  Comments begin with '#' or ';'. Do not use quotes unless in a comment.
#
#  SIGHUP Reload:
#    Most settings can be reloaded at runtime by sending SIGHUP to the
#    urfd process. See the README for which parameters require a restart.
#    Docker: docker exec <container> kill -HUP $(pgrep urfd)
##############################################################################

[Names]
Callsign = URF???              # Reflector callsign (A-Z, 0-9 only)
SysopEmail = me@somewhere.com
Country = DE                   # 2-letter ISO country code (https://www.iban.com/country-codes)
Sponsor = My Club
DashboardUrl = https://my-reflector.example.com

# DHT bootstrap node. Choose a nearby, active reflector or use xrf757.openquad.net
Bootstrap = xrf757.openquad.net

##############################################################################
#  CallingHome (XLX directory registration)
#  Lists the reflector in Pi-Star, WPSD and other hotspot software, by pushing
#  its details to the XLX directory every few minutes. This replaces the
#  dashboard's $CallingHome['Active'], which the dashboard no longer does.
#  The hash identifies the reflector in the directory, which ties the name
#  to the first hash it sees. Left blank, the reflector makes one at its first
#  start and saves it here as Hash. Keep it from then on. Moving a reflector
#  that is listed already: put its old hash here (from the old dashboard's
#  callinghome.php), a new one would not be accepted.
#  The DashboardUrl from [Names] is the URL sent. A '#' starts a comment
#  here too, so it can't be part of Comment.
#  [requires restart]
##############################################################################

[CallingHome]
Enable = false
Country = Germany              # country name as shown in the directory
Comment = My URF Reflector     # max 100 characters
# Hash =                       # letters and digits; blank = made at first start
# OverrideIP =                 # blank = the directory uses the address it sees
# Server = http://xlxapi.rlx.lu/api.php
# PushDelay = 300              # seconds between updates (60-86400)
# Timeout = 5                  # seconds before giving up on the directory (1-60)

##############################################################################
#  Network
#  IPv4Binding is required. IPv6 is optional (uncomment for dual-stack).
#  External addresses are auto-detected via icanhazip.com if not set.
#  [requires restart]
##############################################################################

[IP Addresses]
IPv4Binding = 0.0.0.0          # Usually the 'any' address
# IPv6Binding = ::             # Uncomment for dual-stack (IPv4 + IPv6)
# IPv4External = 4.3.2.1       # Override auto-detection (ipv4.icanhazip.com)
# IPv6External = f:e:d:c:b:a:9:0

##############################################################################
#  Modules
#  Up to 26 modules (A-Z), non-contiguous allowed.
#  Each module can have a description shown in the dashboard, and a talkgroup
#  (TG<M> = <number>, each number once): an MMDVMClient's TS1 / TS2 = <modules>
#  and plugins take it from here, so it is written only once.
#  [requires restart to add/remove modules]
##############################################################################

[Modules]
Modules = ADMSZ
DescriptionA = All Modes
DescriptionD = DMR Chat
DescriptionM = M17 Chat
DescriptionS = DStar Chat
DescriptionZ = Echo
# TGD = 262                    # Module D's talkgroup

##############################################################################
#  Transcoder
#  Enables cross-mode audio between protocols (requires tcd).
#  Set Port = 0 if no transcoder is available.
#  Modules string is reloaded on SIGHUP.
#  [port/binding require restart]
##############################################################################

[Transcoder]
Port = 10100
BindingAddress = 127.0.0.1     # Loopback for local tcd, 0.0.0.0 for remote
Modules = A                    # Which modules to transcode, or auto: the ones tcd has in its
                               # Modules, each while tcd is connected for it (tcd decides alone);
                               # reloaded with SIGHUP, Port and BindingAddress need a restart;
                               # a tcd with StandbyModules (urfd 4.26.0) gets a module only
                               # while no other tcd has it
# Password for a remote tcd, the same as Password in its tcd.ini. Without it,
# anyone who reaches the port can take over the transcoded modules. Use a long
# random one without '#' or spaces. [requires restart]
#Password =

##############################################################################
#  Echo Module
#  Built-in parrot/echo. Plays back audio after 3 seconds of silence.
#  [requires restart]
##############################################################################

[Echo]
Enable = true
Module = Z                     # Must be listed in [Modules] above

##############################################################################
#  Protocols
#  All protocols support Enable = true/false (default: true).
#  Disabled protocols won't bind their port or appear in the dashboard.
#  [enable/disable and port changes require restart]
##############################################################################

##############################################################################
#  DCS
#  D-Star reflector protocol, also native DCS peering (Callsign).
##############################################################################

[DCS]
# Enable = true
Port = 30051
# Callsign = DCS363            # Optional: callsign for native DCS peering

##############################################################################
#  DExtra
#  D-Star reflector protocol (XRF).
##############################################################################

[DExtra]
# Enable = true
Port = 30001

##############################################################################
#  DPlus
#  D-Star reflector protocol (REF) for gateways and dongles.
##############################################################################

[DPlus]
# Enable = true
Port = 20001

##############################################################################
#  G3
#  Icom Terminal and Access Point mode (high resource usage).
##############################################################################

[G3]
Enable = false                 # Icom Terminal/Access Point mode (high resource usage)

##############################################################################
#  MMDVM Server
#  Accept incoming connections from MMDVM hotspots/repeaters directly.
#  Implements the HomeBrew DMR protocol (RPTL->RPTK->RPTC->RPTO handshake).
#  Works without transcoder for pure DMR; transcoded modules needed for
#  cross-mode bridging. Extended 9-digit DMR IDs (BrandMeister-style)
#  are handled automatically — one user entry covers all xx00-xx99 extensions.
#  [enable/port require restart; TGs and users reloaded on SIGHUP]
##############################################################################

# [MMDVM]
# Enable = true
# Port = 62030
# FallbackDmrId = 0              # DMR ID for talkers without one, to the hotspots, DMR+ and P25 (0 or omit = drop)
# RequireAuth = true             # false = open access, no user/password required
# BlockProtocols = SVXServer,USRP  # Block protocols bidirectionally
#
# TG mapping: TG<number> = <Module>[,TS<1|2>]
# First TG per module = primary (TX/RX). Additional = secondary (RX only).
# Default timeslot is TS2.
# Dual-slot: each timeslot links independently to its module.
# From the module talkgroups ([Modules] TG<M>): TS1 / TS2 = <modules> maps
# them on that timeslot, TGs = auto every other module with a talkgroup
# (on TS2, or TGs = auto,TS1); TG lines win.
# TS1 = F
# TGs = auto
# For dual-slot to work, map TGs for different modules to different timeslots.
# TG9 = A,TS2                   # Common hotspot default
# TG26363 = F,TS1               # Local TG -> Module F on TS1
#
# RequireAuth: when true (default), users must be configured below.
# Set to false to accept all connections without authentication (legacy behavior).
# RequireAuth = false
#
# User authentication: <BASE-DMRID> or <CALLSIGN> = <password>
# No users configured = all logins rejected (unless RequireAuth = false).
# One entry covers all 9-digit extensions (e.g. 1234567 covers 123456700-99).
# Password may be empty to allow any password (useful for compat hotspots).
# Users can also be added/removed at runtime via the Admin interface.
# 1234567 = changeme             # 7-digit base DMR ID
# N0CALL = changeme               # Callsign (resolved to DMR ID at startup)
# 2632545 =                      # Open access (no password required)

##############################################################################
#  DMRPlus
#  DMR+ protocol (DMO mode) for hotspots and repeaters.
##############################################################################

[DMRPlus]
# Enable = true
Port = 8880

##############################################################################
#  M17
#  Clients pick the module when they link (e.g. URF363 B), and relink to change it;
#  they talk on the linked module whatever the destination, as on mrefd.
#  Sending to PARROT or ECHO reaches the [Echo] module from any linked module,
#  a packet mode packet to PARROT or ECHO comes straight back.
##############################################################################

[M17]
# Enable = true
Port = 17000
# M17 designator (M17-XXX) this reflector uses to interlink with mrefd
# reflectors listed in urfd.interlink. mrefd only accepts M17-XXX callsigns.
# It is published in the Ham-DHT for mrefd, so it must not be used by any
# other M17 reflector. Without it, M17 interlinking is off.
# Callsign = M17-XXX

##############################################################################
#  YSF / C4FM
#  URF acts as a YSF Master providing Wires-X rooms (one per module).
#  No registration at ysfreflector.de needed - URF is discovered via XLX API.
#  DG-ID module selection: DG-ID 10=A, 11=B, ... 35=Z
##############################################################################

[YSF]
# Enable = true
Port = 42000
AutoLinkModule = A             # Module YSF clients land on at connect (comment out to disable)
EnableDGID = false             # Allow module switching via DG-ID values 10-35
DefaultTxFreq = 446500000
DefaultRxFreq = 446500000
RegistrationID = 12345         # Numeric ID for YSF status packets (any unique number)
RegistrationName = DE URF???   # Display name for YSF clients (max 13 chars)
RegistrationDescription = URF Reflector  # Description (max 16 chars)

##############################################################################
#  P25
#  P25 reflector protocol for P25Gateway.
##############################################################################

[P25]
# Enable = true
Port = 41000
AutoLinkModule = A             # Comment out to disable auto-link
ReflectorID = 12345

##############################################################################
#  NXDN
#  NXDN reflector protocol for NXDNGateway. Module selection by RAN or by
#  destination ID, see below.
##############################################################################

[NXDN]
# Enable = true
Port = 41400
AutoLinkModule = A             # Module for RAN 0 and RAN 1 (comment out to disable)
ReflectorID = 12345
# FallbackNxdnId = 8970        # NXDN ID for unknown callers (0 or omit = drop)
# ModuleDstIdBase = 4000       # dstId base for module selection (omit to disable)
#
# Module selection via RAN (Radio Access Number):
#   RAN 1-26 maps to Module A-Z, with one swap: RAN 1 always reaches the
#   AutoLinkModule, and Module A takes the AutoLinkModule's own RAN instead.
#   With AutoLinkModule = S that means RAN 1 = S and RAN 19 = A, everything
#   else keeps its natural RAN (RAN 2 = B, RAN 3 = C, ...).
#   RAN 0 also maps to AutoLinkModule.
# The swap is needed because RAN 1 is all most clients can send: DroidStar
# hardcodes it, and MMDVMHost replaces the radio's RAN with the hotspot's
# configured one, which defaults to 1. Per-transmission RAN switching from the
# radio therefore only works on a direct connection, not through a hotspot.
#
# Module selection via destination ID (takes precedence over the RAN):
#   Set ModuleDstIdBase to enable. dstId base+1 to base+26 maps to Module A-Z,
#   every other dstId falls through to the RAN, so the plain ReflectorID keeps
#   reaching the AutoLinkModule. With ModuleDstIdBase = 4000 the destination IDs
#   line up with the DMR+ TG mapping (4001 = A, 4002 = B, ...).
#   Evaluated in the connect poll and in every frame.
# This is the only module selection available to clients that cannot set a RAN.
# DroidStar users add one custom host per module in the settings, the number is
# the dstId:  NXDN 4003 my.reflector.org 41400   -> Module C
# Outgoing frames carry the dstId each client polled with, because NXDNGateway
# drops frames addressed to anything but the TG the hotspot is linked to.
#
# NXDN ID resolution: NXDN DB -> DMR DB fallback (by callsign).
# Unknown IDs are dropped unless FallbackNxdnId is set.

##############################################################################
#  URF Interlink
#  Linking with other URF reflectors, see urfd.interlink.
##############################################################################

[URF]
# Enable = true
Port = 10017
# Interlink version announced to URF peers:
#  4 (default) adds the M17 META type and CAN to the stream header, sent only to
#    peers that announce 4 as well; peers announcing 3 get the legacy header.
#  3 legacy mode: announce 3 and never send the M17 extension.
# InterlinkVersion = 4

##############################################################################
#  XLX Peering
#  Required for XLX peers and DCS peers using XLX protocol in urfd.interlink.
#  Optional Callsign overrides how this reflector identifies to XLX peers.
##############################################################################

[XLXPeer]
Enable = false
Port = 10002
# Callsign = XLX363

##############################################################################
#  USRP / AllStar
#  One AllStar node over USRP on a transcoded module.
##############################################################################

[USRP]
Enable = false
Callsign = ALLSTAR
IPAddress = 1.2.3.4            # AllStar node IP
RxPort = 34000
TxPort = 32000
Module = A                     # Must be a transcoded module
# FilePath = /home/user/clients.txt  # Optional: list of listen-only clients
# RxGain = 0                   # Incoming audio gain in dB (-40 to +40), before the transcoder
# TxGain = 0                   # Outgoing audio gain in dB (-40 to +40), after the transcoder

##############################################################################
#  MMDVMClient
#  Connect to a DMR master server (e.g. BrandMeister) via the MMDVM protocol.
#  Maps talkgroups to reflector modules with timeslot support.
#  Multiple TGs can share a module: the first TG listed becomes the primary
#  (used for outbound TX), additional TGs are secondary (inbound RX only).
#  Dynamic TGs can be added at runtime via the Admin interface.
#  TG mappings are reloaded on SIGHUP (dynamic TGs are preserved).
#  [enable/port/master require restart]
##############################################################################

[MMDVMClient]
Enable = false
MasterAddress = 44.131.4.1     # MMDVM master server IP or DNS hostname
MasterPort = 62031
# LocalPort = 12345            # Fixed local UDP source port (omit = OS-assigned)
DmrId = 1234567                # Your registered DMR/hotspot ID
Password = changeme            # MMDVM hotspot security password
Callsign = N0CALL              # Callsign (used for DMR-ID lookup on kerchunk)
Latitude = 0.0
Longitude = 0.0
Location = My City
Description = My URF Reflector
URL = https://example.com
RxFreq = 430412500             # must differ from TxFreq: the hotspot is duplex (two timeslots), BrandMeister refuses RX = TX
TxFreq = 439812500
# Software = MMDVM_URFD_Virtual
# Firmware = 20261031_URFD
# FallbackDmrId = 1234567      # DMR ID for talkers without one (0 or omit = drop)
# BlockProtocols = SvxReflector,YSF  # Block protocols bidirectionally
#
# BrandMeister API (optional): sync static TGs, add/remove via API instead of kerchunk
# Get your API key from BrandMeister SelfCare -> Profile -> Security -> API Keys
# BrandMeisterApiKey = eyJ0eXAiOiJKV1Qi...
#
# TG mapping: TG<number> = <Module>[,TS<1|2>]
# First TG per module = primary (TX/RX). Additional = secondary (RX only).
# Default timeslot is TS2.
TG91 = A,TS2                   # Worldwide -> Module A (primary)
# TS1 = D                      # the talkgroup of module D ([Modules] TGD) on TS1, as TG262 = D,TS1
# TG262 = A,TS2                # Germany -> Module A (secondary, RX only)
# TG26363 = B,TS1              # Local -> Module B (primary)
# Network = brandmeister.network  # default: brandmeister.network for BM masters, else the host

##############################################################################
#  Further MMDVMClient connections: [MMDVMClient.<name>]
#  Each a hotspot of its own with two timeslots and its own TGs: more modules
#  on BrandMeister at once, or other networks (TGIF, FreeDMR, ...). A named
#  connection takes what it leaves out from [MMDVMClient]: master, port,
#  password, callsign, FallbackDmrId, Software, Firmware, location, Network
#  with the master and in that network the BrandMeisterApiKey (LocalPort,
#  BlockProtocols and Enable stay per connection). Its DmrId of one or
#  two digits is a suffix to the DmrId of [MMDVMClient], a longer one the whole
#  ID; without a DmrId a name of digits is the suffix: [MMDVMClient.50] is
#  hotspot <DmrId>50. [MMDVMClient] without TGs of its own is then only the
#  shared settings. The name shows in the log, on the admin page and in
#  BlockProtocols (BlockProtocols = MMDVMClient.50). At most 9 connections; the
#  older [MMDVMClient2] ... [MMDVMClient9] with all keys still work, a file uses
#  one of the two ways.
#  Connections in one network never pass calls to each other and may not
#  share a TG or hotspot ID. Between networks a module both map is bridged,
#  BlockProtocols = <connection> switches that off for that pair; in any
#  BlockProtocols MMDVMClient means every connection.
#  A TG may sit on a module without transcoding: only DMR, YSF and NXDN
#  reach the master from there.
#  [requires restart]
##############################################################################

# [MMDVMClient.50]             # hotspot <DmrId of [MMDVMClient]>50
# TG262 = D,TS2                # Germany -> Module D
# TG3100 = U,TS1               # USA -> Module U

##############################################################################
#  SvxReflector
#  Connect to a SvxLink SvxReflector server (e.g. FM-Funknetz).
#  Uses TCP for signaling (auth, heartbeat, talker start/stop) and
#  UDP for OPUS-encoded audio. Requires transcoded modules.
#  Audio is bridged bidirectionally with all other protocols on the module.
#  Dynamic TGs can be added at runtime via the Admin interface.
#  TG mappings are reloaded on SIGHUP (dynamic TGs are preserved).
#  When all dynamic TGs expire, SELECT_TG(0) is sent to unsubscribe.
#  [enable/host/port require restart]
##############################################################################

[SvxReflector]
Enable = false
Host = svxreflector.example.com   # DNS hostname or IP
Port = 5300                        # TCP and UDP port (same)
Callsign = N0CALL-HS              # Node callsign (as registered on server)
Password = changeme                # Authentication password
# BlockProtocols = MMDVMClient,USRP  # Block protocols bidirectionally
# RxGain = 0                        # Incoming audio gain in dB (-40 to +40, default 0)
# TxGain = 0                        # Outgoing audio gain in dB (-40 to +40, default 0)
# Software = urfd                   # software name in the node info; for servers that require a specific one
#
# TG mapping: TG<number> = <Module>
# Modules must be transcoded. Multiple TGs per module supported.
# One TG is selected on the reflector at a time: the lowest static one by
# default, the others are monitored and selected when a talker starts there.
# TG1 = A

##############################################################################
#  SVXServer
#  Accept incoming connections from SvxLink nodes.
#  Acts as a SvxReflector server (protocol V2, HMAC-SHA1 auth, OPUS audio).
#  Requires transcoded modules. Users authenticate with callsign + password.
#  TG mapping: TG<number> = <Module> (a node selects one TG via MsgSelectTG,
#  nodes on the same TG hear each other). Nodes must use protocol 2.0.
#  Users and TGs can be managed at runtime via the Admin interface.
#  TG mappings are reloaded on SIGHUP (dynamic TGs are preserved).
#  [enable/port require restart]
##############################################################################

[SVXServer]
Enable = false
Port = 5300                        # TCP and UDP port (same)
# BlockProtocols = MMDVMClient,USRP  # Block protocols bidirectionally
# RxGain = 0                        # Incoming audio gain in dB (-40 to +40)
# TxGain = 0                        # Outgoing audio gain in dB (-40 to +40)
#
# TG mapping: TG<number> = <Module>
# Modules must be transcoded. Multiple TGs per module supported.
# TGs = auto                       # every module with a talkgroup ([Modules] TG<M>); TG lines win
# TG26363 = A
#
# User authentication: <Callsign> = <Password>
# Users can also be added/removed at runtime via the Admin interface.
# N0CALL-HS = changeme

##############################################################################
#  Plugins
#  Protocols from shared objects, built against this urfd's sources (see
#  reflector/Plugin.h and the README). One Load line per file; a plugin named
#  Foo reads its settings from [Foo] in this file.
#  [requires restart]
##############################################################################

[Plugins]
# Load = /usr/local/lib/urfd/myproto.so

##############################################################################
#  Admin Interface
#  JSON-based TCP socket for runtime management from the dashboard.
#  Features: dynamic TG add/remove, kerchunk on demand (MMDVM), reconnect,
#  transcoder stats, live log viewer, protocol block display.
#  The dashboard's admin page logs in with this password.
#  [requires restart]
##############################################################################

[Admin]
Enable = false
Port = 10101
Password = changeme
# BindingAddress = 127.0.0.1   # Default: loopback only

##############################################################################
#  Credentials
#  The logins of [MMDVM] and [SVXServer] (and of plugins) from a database as well,
#  so another program can manage them. The users in this file stay valid and
#  win; the admin page adds new users to the database. The database holds the
#  passwords as plain text (the protocols need them for their challenge).
#  Table: service ('mmdvm', 'svx' or a plugin's), username (DMR ID or
#  callsign), password, callsign (for plugins, optional), enabled (0 = off).
#  urfd creates the table if it may. See docs/CREDENTIALS.md.
#  [requires restart]
##############################################################################

[Credentials]
Backend = ini              # ini (no database), sqlite, mysql or postgresql
# Path = /usr/local/etc/urfd/credentials.db   # sqlite, default: next to urfd.ini
# Host = localhost         # mysql, postgresql
# Port = 3306              # default: 3306 (mysql), 5432 (postgresql)
# Database = urfd
# User = urfd
# Password = changeme
# Table = urfd_credentials
# Timeout = 3              # seconds for the connection and a query
# CacheTTL = 300           # seconds a login from the database stays cached
# NegativeTTL = 60         # seconds an unknown user is remembered as unknown
# CacheSize = 1000         # logins in the cache, the least recently used go

##############################################################################
#  WebSocket
#  Live events for the dashboard: clients, peers and talking stations as they
#  change, and the whole state when a client connects (no IP addresses). Read
#  only, without a password: keep it on loopback and let the web server pass
#  /ws through (nginx: proxy_pass with Upgrade/Connection headers).
#  [requires restart]
##############################################################################

[WebSocket]
Enable = false
Port = 10102
# BindingAddress = 127.0.0.1   # Default: loopback only
# MaxClients = 64              # connections at the same time
# QueueLength = 256            # unsent events per client before it is dropped
# PingInterval = 30            # seconds of silence before a ping
# IdleTimeout = 90             # seconds without an answer before hanging up

##############################################################################
#  Databases
#  Mode: "http", "file", or "both" (http loaded first, then file appended)
#  URL and FilePath must serve data in the expected format (see below).
#  RefreshMin = interval in minutes between automatic re-downloads.
##############################################################################

##############################################################################
#  DMR ID Database
#  One entry per line, fields in the order:
#    <dmrid><sep><callsign><sep><name>
#  Example: 2621001;DL1ABC;John Doe;
#  The separator may be ';', ',' or a tab, so the common publishers can be used as
#  they are. IDs must be 1-9999999; lines that do not start with an ID (such as a
#  CSV header) are skipped.
#
#  URL accepts a comma separated list. The first entry is the primary source, the
#  rest are tried in order when it cannot be reached. Every successful download is
#  mirrored to <FilePath>.cache, which is reloaded at startup if no source answers,
#  so a directory outage no longer leaves the database empty.
#  xlxapi has no names (id;callsign;), and the name is what the DMR talker alias
#  carries after the callsign, so it comes last.
##############################################################################

[DMR ID DB]
Mode = http
FilePath = /home/user/dmrid.dat
URL = https://radioid.net/static/user.csv, http://www.pistar.uk/downloads/DMRIds.dat, http://xlxapi.rlx.lu/api/exportdmr.php
RefreshMin = 179

##############################################################################
#  NXDN ID Database
#  Comma separated, one entry per line:
#    <nxdnid>,<callsign>,<name>,
#  Example: 12345,DL1ABC,John Doe,
#  IDs must be 1-65535. Third field (name) is ignored but must be present.
##############################################################################

[NXDN ID DB]
Mode = http
FilePath = /home/user/nxdn.dat
URL = https://radioid.net/static/nxdn.csv
RefreshMin = 1440              # radioid.net updates once per day

##############################################################################
#  YSF TX/RX Database
#  One entry per line, fields in the order:
#    <callsign><sep><txfreq><sep><rxfreq>
#  Example: DL1ABC;439125000;431525000;
#  Frequencies in Hz, must be > 40 MHz. Used for YSF node frequency reporting.
#  Separator handling, the comma separated URL list and the .cache fallback work
#  exactly as described for [DMR ID DB]. No second publisher of this data is known,
#  so the cache is the only fallback here.
##############################################################################

[YSF TX/RX DB]
Mode = http
FilePath = /home/user/ysfnode.dat
URL = http://xlxapi.rlx.lu/api/exportysfrepeaters.php
RefreshMin = 191

##############################################################################
#  File Paths
#  Whitelist, blacklist and interlink are reloaded on SIGHUP.
##############################################################################

[Files]
PidPath = /var/run/xlxd.pid
XmlPath = /var/log/xlxd.xml
# JsonPath = /var/tmp/urfd.json      # Future use
WhitelistPath = /home/user/urfd.whitelist
BlacklistPath = /home/user/urfd.blacklist
InterlinkPath = /home/user/urfd.interlink
G3TerminalPath = /home/user/urfd.terminal

