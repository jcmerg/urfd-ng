#  Connect to external D-Star reflectors as a client node.
#  Map<N> = host,port,remote_module,local_module
#  Callsign must be whitelisted/registered on the target reflector.
#  [requires restart to enable/disable; mappings can be added dynamically via admin]
##############################################################################

# [DCSClient]
# Enable = true
# Callsign = YOURCALL
# Map1 = dcs002.xreflector.net,30051,A,S
# BlockProtocols =

# [DExtraClient]
# Enable = true
# Callsign = YOURCALL
# Map1 = xrf757.openquad.net,30001,A,A
# BlockProtocols =

# [DPlusClient]
# Enable = true
# Callsign = YOURCALL                       # Must be registered at dstargateway.org
# Map1 = ref001.dstargateway.org,20001,A,A
# BlockProtocols =

##############################################################################
#  YSF Client Connector
#  Connect to external YSF reflectors as a client node.
#  Map<N> = host,port,local_module[,dgid]
#  DG-ID is optional (0 = disabled). When set, included in outbound FICH.
#  [requires restart to enable/disable; mappings can be added dynamically via admin]
##############################################################################

