##############################################################################
#  urfd.ini, the reflector of urfd-ng. Every key: docs/CONFIGURATION.md
#  Comments: '#' or ';' at the start of a line, only '#' after a value; no
#  quotes. Names are case-sensitive; booleans true/false.
#  Most settings reload on SIGHUP (docs/CONFIGURATION.md says which need a
#  restart). Docker: docker exec urfd pkill -HUP -x urfd (or sudo ./setup.sh reload)
##############################################################################

[Names]
Callsign = URF???              # URF and three letters/digits, e.g. URF363 (required)
SysopEmail = me@somewhere.com
Country = DE                   # 2-letter ISO country code
Sponsor = My Club
DashboardUrl = https://my-reflector.example.com
# DHT bootstrap node: a nearby, active reflector
Bootstrap = xrf757.openquad.net

# The XLX directory (Pi-Star, WPSD and other hotspot lists). Hash: blank = made
# at the first start; when moving a listed reflector, its old hash.
[CallingHome]
Enable = false
Country = Germany              # country name as shown in the directory
Comment = My URF Reflector     # max 100 characters
# Hash =                       # letters and digits; blank = made at first start
# OverrideIP =                 # blank = the directory uses the address it sees
# Server = http://xlxapi.rlx.lu/api.php
# PushDelay = 300              # seconds between updates (60-86400)
# Timeout = 5                  # seconds before giving up on the directory (1-60)

# External addresses: set, or found through IPCheckUrl at start and every IPCheckInterval
[IP Addresses]
IPv4Binding = 0.0.0.0          # Usually the 'any' address
# IPv6Binding = ::             # Uncomment for dual-stack (IPv4 + IPv6)
# IPv4External = 203.0.113.10  # Fixed external address, not detected (e.g. behind NAT)
# IPv6External = f:e:d:c:b:a:9:0
# IPCheckUrl = https://icanhazip.com, https://ifconfig.me/ip, https://api64.ipify.org, https://ident.me
# IPCheckInterval = 300        # seconds between checks while urfd runs (0 = only at start, else at least 30)

# Up to 26 modules A-Z; TG<M>: the module's talkgroup for the DMR connectors
[Modules]
Modules = ADMSZ
DescriptionA = All Modes
DescriptionD = DMR Chat
DescriptionM = M17 Chat
DescriptionS = DStar Chat
DescriptionZ = Echo
# TGD = 262                    # Module D's talkgroup
# ProtocolsS = DExtra,DPlus,DCS # Module S: these protocols only, closed to all others (reloaded on SIGHUP)
# HideUnlisted = S             # modules whose talkers without a DMR/NXDN ID entry stay off the dashboard

# Cross-mode audio through tcd; Port = 0 without one
[Transcoder]
Port = 10100                   # 0 = no transcoder, else 1025-40000 (tcd needs that range too)
BindingAddress = 127.0.0.1     # Loopback for local tcd, 0.0.0.0 for remote
Modules = A                    # the transcoded modules, or auto: the ones tcd has in its Modules
# the same as Password in tcd.ini, for a tcd on another host: long, letters and digits
#Password =

# Plays a transmission back after 3 s of silence
[Echo]
Enable = true
Module = Z                     # Must be listed in [Modules] above

##############################################################################
#  Protocols. Without Enable: DCS, DExtra, DPlus, DMRPlus, M17, YSF and URF
#  on (NXDN and P25 with a Port); MMDVM, OpenBridge, SvxReflector, SVXServer,
#  XLXPeer, G3, USRP, Admin and the client connectors off.
##############################################################################

[DCS]
# Enable = true
Port = 30051
# Callsign = DCS363            # Optional: callsign for native DCS peering

[DExtra]
# Enable = true
Port = 30001

[DPlus]
# Enable = true
Port = 20001

[G3]
Enable = false                 # Icom Terminal/Access Point mode (high resource usage)

# MMDVM hotspots and repeaters log in directly (HomeBrew DMR). TG<number> =
# <Module>[,TS<1|2>]: the first TG of a module is primary (TX/RX), more RX only.
# Users: <base DMR ID> or <callsign> = <password>, none = all logins refused.
# [MMDVM]
# Enable = true                  # required: MMDVM is off without it
# Port = 62030
# FallbackDmrId = 0              # DMR ID for talkers without one, to the hotspots, DMR+ and P25 (0 or omit = drop)
# RequireAuth = true             # false = open access, no user/password required
# DynamicTimeout = 5             # minutes until a slot's dynamic module unlinks without a call on it (0 = never)
# BlockProtocols = SVXServer,USRP  # Block protocols bidirectionally
# TS1 = F                        # the module talkgroups on TS1 ([Modules] TG<M>)
# TGs = auto                     # every other module with a talkgroup
# TG9 = A,TS2                    # Common hotspot default
# TG26363 = F,TS1                # Local TG -> Module F on TS1
# 1234567 = changeme             # 7-digit base DMR ID, covers 123456700-99
# N0CALL = changeme              # Callsign (resolved to DMR ID at startup)
# 1234568 =                      # Open access (no password required)

[DMRPlus]
# Enable = true
Port = 8880

# Clients pick the module when they link; PARROT or ECHO reach the [Echo] module
[M17]
# Enable = true
Port = 17000
# M17-XXX designator for interlinking with mrefd (urfd.interlink); unique in the Ham-DHT
# Callsign = M17-XXX

# A YSF master with one Wires-X room per module; DG-ID 10 = A ... 35 = Z
[YSF]
# Enable = true
Port = 42000
AutoLinkModule = A             # Module YSF clients land on at connect (comment out to disable)
EnableDGID = false             # Allow module switching via DG-ID values 10-35
DefaultTxFreq = 446500000
DefaultRxFreq = 446500000
RegistrationID = 12345         # Numeric ID for YSF status packets (any unique number, 0-9999999)
RegistrationName = DE URF???   # Display name for YSF clients (max 13 chars)
RegistrationDescription = URF Reflector  # Description (max 16 chars)

[P25]
# Enable = true
Port = 41000
AutoLinkModule = A             # Comment out to disable auto-link
ReflectorID = 12345            # the TG P25Gateway links to (0-16777215, required)

# The module by RAN (1 = AutoLinkModule) or by destination ID (ModuleDstIdBase + 1 = A ...)
[NXDN]
# Enable = true
Port = 41400
AutoLinkModule = A             # Module for RAN 0 and RAN 1 (comment out to disable)
ReflectorID = 12345            # the reflector NXDNGateway links to (0-65535, required)
# FallbackNxdnId = 8970        # NXDN ID for unknown callers (0 or omit = drop)
# ModuleDstIdBase = 4000       # dstId base for module selection (omit to disable)

# Interlink with other URF reflectors (urfd.interlink)
[URF]
# Enable = true
Port = 10017
# InterlinkVersion = 4         # 3 = the legacy header without the M17 extension

# XLX peers and DCS peers over XLX in urfd.interlink
[XLXPeer]
Enable = false
Port = 10002
# Callsign = XLX363

# One AllStar node over USRP, on a transcoded module
[USRP]
Enable = false
Callsign = ALLSTAR
IPAddress = 1.2.3.4            # AllStar node IP
RxPort = 34000
TxPort = 32000
Module = A                     # Must be a transcoded module
# FilePath = /usr/local/etc/urfd/clients.txt  # Optional: list of listen-only clients
# RxGain = 0                   # Incoming audio gain in dB (-40 to +40), before the transcoder
# TxGain = 0                   # Outgoing audio gain in dB (-40 to +40), after the transcoder

# A hotspot on a DMR master (BrandMeister, ...). TG<number> = <Module>[,TS<1|2>]:
# the first TG of a module is primary (TX), more RX only; default TS2.
[MMDVMClient]
Enable = false
MasterAddress = 2622.master.brandmeister.network   # DNS name of the master; with an IP address set Network
MasterPort = 62031
# LocalPort = 12345            # Fixed local UDP source port (omit = OS-assigned)
DmrId = 1234567                # Your registered DMR/hotspot ID
Password = changeme            # MMDVM hotspot security password
Callsign = N0CALL              # Callsign (used for DMR-ID lookup on kerchunk)
Latitude = 0.0
Longitude = 0.0
Location = My City
Description = My URF Reflector
URL = https://example.com
RxFreq = 430412500             # must differ from TxFreq: BrandMeister refuses RX = TX
TxFreq = 439812500
# Software = MMDVM_URFD_Virtual
# Firmware = 20261107_URFD
# FallbackDmrId = 1234567      # DMR ID for talkers without one (0 or omit = drop)
# BlockProtocols = SvxReflector,YSF  # Block protocols bidirectionally
# BrandMeisterApiKey = eyJ0eXAiOiJKV1Qi...   # optional: static TGs through the BrandMeister API
TG91 = A,TS2                   # Worldwide -> Module A (primary)
# TS1 = D                      # the talkgroup of module D ([Modules] TGD) on TS1, as TG262 = D,TS1
# TG262 = A,TS2                # Germany -> Module A (secondary, RX only)
# TG26363 = B,TS1              # Local -> Module B (primary)
# Network = brandmeister.network  # default: brandmeister.network for BM masters, else the host

# More hotspots (at most 9): [MMDVMClient.<name>] takes what it leaves out from
# [MMDVMClient]; a DmrId of one or two digits (or a name of digits) is a suffix.
# [MMDVMClient.50]             # hotspot <DmrId of [MMDVMClient]>50
# TG262 = D,TS2                # Germany -> Module D
# TG3100 = U,TS1               # USA -> Module U

# Server to server with HBlink3, HBlink4, FreeDMR or BrandMeister; both ends
# configure the link. TG<number> = <Module>, no timeslot. IPv4 only.
# [OpenBridge]
# Enable = true                  # required: OpenBridge is off without it
# TargetAddress = obp.example.net  # the other end
# TargetPort = 62035
# LocalPort = 62035              # where the other end sends to (default 62035, open it for UDP)
# NetworkId = 1234567            # our ID in every packet: the other end's NETWORK_ID for us
# Passphrase = changeme          # the same at both ends, 20 characters at most
# Dialect = classic              # classic (HBlink3, HBlink4, BrandMeister) or freedmr
# AutoUpgrade = true             # a classic link turns freedmr when the other end speaks it
# SourceServer = 2621            # FreeDMR: the source server of our calls (default NetworkId)
# PeerId = 7654321               # accept this repeater ID only (HBlink: its NETWORK_ID, FreeDMR: its SERVER_ID)
# PreserveSourcePeer = false     # classic: the hotspot's ID instead of NetworkId
# FallbackDmrId = 1234567        # DMR ID for talkers without one (0 or omit = drop)
# BlockProtocols = SvxReflector  # Block protocols bidirectionally
# Network = freedmr              # default: the target's host (brandmeister.network for BM)
# TGs = auto                     # every module with a talkgroup ([Modules] TG<M>)
# Modules = D                    # these modules' talkgroups
# TG91 = A                       # Worldwide -> Module A

# A node on a SvxReflector server (FM-Funknetz, ...); TG<number> = <Module>, transcoded modules
[SvxReflector]
Enable = false
Host = svxreflector.example.com   # DNS hostname or IP
Port = 5300                        # TCP and UDP port (same)
Callsign = N0CALL-HS              # Node callsign (as registered on server)
Password = changeme                # Authentication password
# BlockProtocols = MMDVMClient,USRP  # Block protocols bidirectionally
# RxGain = 0                        # Incoming audio gain in dB (-40 to +40, default 0)
# TxGain = 0                        # Outgoing audio gain in dB (-40 to +40, default 0)
# Software = urfd                   # software name in the node info; for servers that require a specific one
# TG1 = A

# A SvxReflector server for SvxLink nodes (protocol 2.0); users <callsign> = <password>
[SVXServer]
Enable = false
Port = 5300                        # TCP and UDP port (same)
# BlockProtocols = MMDVMClient,USRP  # Block protocols bidirectionally
# RxGain = 0                        # Incoming audio gain in dB (-40 to +40)
# TxGain = 0                        # Outgoing audio gain in dB (-40 to +40)
# TGs = auto                       # every module with a talkgroup ([Modules] TG<M>); TG lines win
# TG26363 = A
# N0CALL-HS = changeme

# Protocols from shared objects (docs/PLUGINS.md); a plugin Foo reads [Foo]
[Plugins]
# Load = /usr/local/lib/urfd/myproto.so

# Runtime management: the dashboard's admin page ([Dashboard] Admin) and a TCP socket for scripts
[Admin]
Enable = false
Port = 10101
Password = changeme
# BindingAddress = 127.0.0.1   # Default: loopback only

# Logins of [MMDVM], [SVXServer] and plugins also from a database (docs/CREDENTIALS.md)
[Credentials]
Backend = ini              # ini (no database), sqlite, mysql or postgresql
# Path = /usr/local/etc/urfd/credentials.db   # sqlite, default: next to urfd.ini
# Host = localhost         # mysql, postgresql
# Port = 3306              # default: 3306 (mysql), 5432 (postgresql)
# Database = urfd
# User = urfd
# Password = changeme
# Table = urfd_credentials
# Timeout = 3              # seconds for the connection and a query
# CacheTTL = 300           # seconds a login from the database stays cached
# NegativeTTL = 60         # seconds an unknown user is remembered as unknown
# CacheSize = 1000         # logins in the cache, the least recently used go

# The dashboard's data (docs/WEBSOCKET.md); keep it on loopback, the web server passes /ws
[WebSocket]
Enable = true
Port = 10102
# BindingAddress = 127.0.0.1   # Default: loopback only
# MaxClients = 64              # connections at the same time
# QueueLength = 256            # unsent events per client before it is dropped
# PingInterval = 30            # seconds of silence before a ping
# IdleTimeout = 90             # seconds without an answer before hanging up

# What the dashboard shows; IPs HideIP (default), ShowLast1ByteOfIP .. ShowLast3ByteOfIP or ShowFullIP
[Dashboard]
# Motd = Scheduled maintenance on Sunday 12:00-14:00 UTC   # a banner on every page
# LastHeard = 40               # rows of the last heard list, urfd keeps as many
# Filter = true                # module keys and callsign filter on Last heard
# Links = 100                  # rows on the Links page
# Peers = 100                  # rows on the Peers page
# LinksIP = HideIP             # e.g. ShowLast2ByteOfIP to show *.*.56.123
# PeersIP = HideIP
# IPMask = *                   # the character for a hidden byte
# Admin = false                # the admin page (π in the footer)

# ID databases: Mode http, file or both; URL a list, the first answering wins; RefreshMin in minutes
[DMR ID DB]
Mode = http
FilePath = /usr/local/etc/urfd/dmrid.dat
URL = https://radioid.net/static/user.csv, http://www.pistar.uk/downloads/DMRIds.dat, http://xlxapi.rlx.lu/api/exportdmr.php
RefreshMin = 179

[NXDN ID DB]
Mode = http
FilePath = /usr/local/etc/urfd/nxdn.dat
URL = https://radioid.net/static/nxdn.csv
RefreshMin = 1440              # radioid.net updates once per day

[YSF TX/RX DB]
Mode = http
FilePath = /usr/local/etc/urfd/ysfnode.dat
URL = http://xlxapi.rlx.lu/api/exportysfrepeaters.php
RefreshMin = 191

# White-, blacklist and interlink reload on SIGHUP; G3TerminalPath: the G3 terminals
[Files]
PidPath = /var/run/xlxd.pid
WhitelistPath = /usr/local/etc/urfd/urfd.whitelist
BlacklistPath = /usr/local/etc/urfd/urfd.blacklist
InterlinkPath = /usr/local/etc/urfd/urfd.interlink
G3TerminalPath = /usr/local/etc/urfd/urfd.terminal

# Client connectors to other reflectors: Map<N> = host,port,remote_module,local_module
# (YSF: host,port,local_module[,dgid]); the callsign must be allowed there
# [DCSClient]
