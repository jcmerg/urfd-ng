# Transcoder Ini file

Port = 10100
ServerAddress = 127.0.0.1
# The reflector's [Transcoder] Password, needed when it has one (tcd over the network).
#Password =

# Must match the transcoded modules in urfd.ini [Transcoder] section, unless that
# says Modules = auto (urfd 4.25.0): then this list alone decides.
# 1 module with single DVSI device, 2 modules with DV3000+DV3003 mixed mode;
# with a codec plugin any number, the ones beyond the devices in software.
Modules = FS

# Standby: modules this tcd takes only while no other tcd has them (urfd 4.26.0,
# with [Transcoder] Modules = auto or the letters listed there). A second tcd,
# e.g. in Docker next to urfd, takes over the modules of the one with the sticks
# while that is gone, and gives them back when it returns; the reflector notices
# a tcd that vanished without closing its connection within about 25 s.
# Not in Modules as well. They count after Modules, so the devices take Modules.
#StandbyModules = FS

# FTDI serial number(s) of the AMBE device(s).
# Use 'tcd --list-devices' to discover connected USB serial devices and their serials.
# Must match exactly: the USB serial (DKB7FXGE), the older libftd2xx form with the
# port letter of multi-port devices (DKB7FXGEA), the /dev/serial/by-id name or /dev/ttyUSBn.
# Without any DeviceSerial, tcd uses every device it recognises as AMBE by its name.
# DV3000 or DV3003 comes from the product ID the chip reports; a device that does
# not answer is left out.
# For mixed mode (DV3000 + DV3003), list both serials. Order does not matter.
# DeviceSerial = DQ015SBR
# DeviceSerial = DKB7FXGE

# Codec plugins: D-Star and/or DMR/YSF in software, from shared objects (see
# CodecPlugin.h and "Codec plugins" in tcd/README.md). A single device needs one
# for the other codec. CodecDStar/CodecDMR name the vocoder new streams get
# (dvsi or a plugin's name); without them the devices come first. The web
# dashboard switches them at run time. Modules beyond the devices' channels (the
# first modules of Modules go to the devices) always use a plugin. Lines tcd
# does not know go to the plugins.
# CodecPlugin = /usr/local/lib/tcd/foo.so
# CodecDStar  = dvsi
# CodecDMR    = foo

# Output Gain (post-AGC, before encoding) — per target codec, in dB (-40 to +40)
# Applied to PCM before encoding. Always effective on cross-mode paths.
# For DMR→DMR/YSF passthrough, OutputGainDMR applies with DmrGainMode=reencode or ambe.
OutputGainDStar = 0
OutputGainM17   = 0
OutputGainDMR   = -14          # DMR radios expect less than the AGC target (BrandMeister speech is about -30 dBFS); every path to DMR/YSF
OutputGainDMRBitstream = -6    # D-Star, M17, P25, USRP, SVX -> DMR/YSF: this many dB of OutputGainDMR through b2 after the encoder, the rest before it (-24 to 0, 0 = all before; more than -6 crackles)
OutputGainIMBE  = 0
OutputGainUSRP  = 0

# DVSI Hardware Gains in dB (-40 to +40)
# Applied inside the DVSI chip at decode/encode time.
# With AGC enabled, these should normally be 0.
DStarGainIn     = 0
DStarGainOut    = 0
DmrGainIn       = 0
DmrGainOut      = 0

# SVX and USRP input/output gains are set per connection in urfd.ini
# ([SvxReflector], [SVXServer], [USRP]: RxGain/TxGain); OutputGainUSRP above
# is the level of the PCM tcd returns for both.

# DMR/YSF Gain Mode — controls how DMR→DMR/YSF output level is adjusted.
#   off      = no gain adjustment on DMR→DMR/YSF passthrough
#   ambe     = AGC + AmbeGainDb through the b2 parameter in the bitstream (no re-encode)
#   reencode = full decode/re-encode through a DMR codec plugin with AGC + DmrReencodeGain
DmrGainMode     = ambe
# OutputGainDMR sets the DMR/YSF level for every path; these two only move
# DMR -> DMR/YSF against the other paths and normally stay 0.
AmbeGainDb      = 0             # for ambe mode: -30 to +10 dB, on top of AGC and OutputGainDMR
DmrReencodeGain = 0             # for reencode mode, on top of AGC and OutputGainDMR

# AGC (Automatic Gain Control)
# Normalizes audio level after decode, before output gains and encoding.
# Pipeline: Source -> [DVSI GainIn] -> PCM -> [AGC] -> [OutputGain] -> Encoder
AGC             = true
AGCTarget       = -16          # target level of active speech in dBFS
AGCAttack       = 50           # ms for rises of the speech level
AGCRelease      = 500          # ms for falls of the speech level (voiced speech only)
AGCMaxGainDown  = 24           # max attenuation in dB
# AGC digital: D-Star, DMR/YSF/NXDN, M17, P25 input
AGCDigitalNoiseGate = -55      # gate threshold in dBFS
AGCDigitalMaxGainUp = 30       # max amplification in dB
AGCDigitalGateFloor = 0        # gain in dB while the gate is closed
# AGC analog: SVX and USRP input, FM audio with a noise floor in its pauses
AGCAnalogNoiseGate  = -40      # gate threshold in dBFS
AGCAnalogMaxGainUp  = 12       # max amplification in dB
AGCAnalogGateFloor  = 0        # gain in dB while the gate is closed (the noise suppression already lowers the pauses)
AGCAnalogNoiseSuppress = -10   # speexdsp noise suppression before the AGC, in dB (-40 to 0, 0 = off)

# Web Dashboard & Monitoring
Monitor          = true
# The monitor's page can change levels and save them. 127.0.0.1 keeps it to this
# machine (reach it with ssh -L 8080:localhost:8080); 0.0.0.0 opens it to the
# network, then set MonitorPassword. With a password the page asks for it (a
# session cookie for 30 days) and tcdmon from other hosts than 127.0.0.1 too
# (tcdmon asks for it, or takes TCD_MONITOR_PASSWORD). It goes over plain HTTP: from
# outside the LAN put a TLS proxy in front or use an ssh tunnel.
MonitorBindAddress = 127.0.0.1
#MonitorPassword =
MonitorHttpPort  = 8080        # web dashboard (http://<host>:8080)
MonitorStatsPort = 8081        # plain TCP stats socket (for tcdmon)
MonitorView      = auto        # modules as cards, compact (a key each, cards for the active ones) or auto (compact from 5 on)

# Stats CSV Logging (per-stream AGC analysis)
# Enable temporarily for tuning, disable in normal operation.
StatsLog       = false
StatsLogDir    = /tmp/tcd-stats
StatsLogRetain = 24            # hours before auto-cleanup
