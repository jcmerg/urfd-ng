# tcd.ini, the transcoder of urfd-ng. Details on every key: tcd/README.md
# The monitor's Save rewrites some lines: keep comments on lines of their own.

# The reflector: urfd.ini [Transcoder] Port and Password (letters and digits)
Port = 10100
ServerAddress = 127.0.0.1
#Password =

# The transcoded modules, as in urfd.ini [Transcoder] (or all of them with Modules = auto)
Modules = FS
# Modules taken only while no other tcd has them (a second tcd as a stand-in)
#StandbyModules = FS

# AMBE devices: without DeviceSerial every DVSI device found, none = no device.
# 'tcd --list-devices' shows the serials; "mixed": one DV3003 does D-Star and DMR.
# DeviceSerial = DKB7FXGE
# DeviceSerial = DKB7FXGE mixed
# DeviceSerial = none
# fixed (default): the channels belong to the first modules; pool: any module
# DeviceChannels = pool
# linear (default), ulaw or alaw: 8-bit audio to the device, no byte lost at 921600 baud
# DeviceCompand = ulaw

# Codec plugins (the vocoders in software): op25 (P25) and codec2 (M17) are built in,
# others from a .so. Codec*: the vocoder new streams get (dvsi or a plugin's name).
CodecPlugin = op25
CodecPlugin = codec2
# CodecPlugin = /usr/local/lib/tcd/foo.so
# CodecDStar  = dvsi
# CodecDMR    = foo
# CodecP25    = op25
# CodecM17    = codec2

# Output gain per target in dB, after the AGC
OutputGainDStar = 0
OutputGainM17 = 0
# DMR radios expect less than the AGC target: about -30 dBFS on every path to DMR/YSF
OutputGainDMR = -14
OutputGainIMBE = 0
OutputGainUSRP = 0
# the part of OutputGainDMR / OutputGainDStar in the frame (b2) for other modes (-24 to 0)
OutputGainDMRBitstream = -6
OutputGainDStarBitstream = 0

# DVSI gains in dB (in the chip, for a codec plugin in software); with the AGC 0
DStarGainIn = 0
DStarGainOut = 0
DmrGainIn = 0
DmrGainOut = 0
# SVX and USRP gains per connection: urfd.ini RxGain/TxGain

# Same mode (DMR -> DMR/YSF, D-Star, P25, M17, USRP/SVX to themselves):
# on (default) = AGC and output gain in the frame, off = unchanged
# DmrGainMode   = off
# DStarGainMode = off
# P25GainMode   = off
# M17GainMode   = off
# USRPGainMode  = off

# D-Star, DMR, P25 to each other on one plugin: direct (from the frames) or audio
Transcode = direct

# Threads that code the modules: auto (one per CPU core) or 1 to 26
Workers = auto

# AGC: levels in dBFS, gains in dB, times in ms
AGC = true
AGCTarget = -16
AGCAttack = 50
AGCRelease = 500
AGCMaxGainDown = 24
# digital sources: D-Star, DMR/YSF/NXDN, M17, P25
AGCDigitalNoiseGate = -55
AGCDigitalMaxGainUp = 30
AGCDigitalGateFloor = 0
# analog sources: SVX, USRP (FM noise in the pauses); noise suppression -40 to 0, 0 = off
AGCAnalogNoiseGate = -40
AGCAnalogMaxGainUp = 12
AGCAnalogGateFloor = 0
AGCAnalogNoiseSuppress = -10

# Monitor (web page and tcdmon). 0.0.0.0 opens it to the network: then set a
# MonitorPassword (letters and digits); plain HTTP, from outside use a TLS proxy or ssh.
Monitor = true
MonitorBindAddress = 127.0.0.1
#MonitorPassword =
MonitorHttpPort = 8080
MonitorStatsPort = 8081
# cards, compact or auto (compact from 5 modules on)
MonitorView = auto

# one log line per stream (frames, vocoders, FEC)
StreamLog = true
# per-stream CSV files for AGC tuning; hours kept
StatsLog = false
StatsLogDir = /tmp/tcd-stats
StatsLogRetain = 24
